defaults:
  - env/isaaclab_kitchen_open_fridge@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

polaris_openpi_ckpt: ${oc.env:POLARIS_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_jointpos_polaris_cri_rlinf_10000}

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_kitchen_open_fridge_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 4
    max_episode_steps: 150
    max_steps_per_rollout_epoch: 150
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    is_eval: True
    seed: 42
    init_params:
      stand_height_m: 0.8
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0.0
      cri_penalty_limit: 0.96
      time_penalty_weight: 0.0
      eval_cam:
        height: 480
        width: 640
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${polaris_openpi_ckpt}
    precision: null
    model_type: "openpi"
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${rollout.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True
      action_env_dim: ${rollout.model.action_dim}
