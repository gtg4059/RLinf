env_type: isaaclab
# DROID abs joint-pos action space (8-D). Used by prepare_actions_for_isaaclab.
action_space: droid_abs_joint_pos
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 450
max_episode_steps: 450

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  # DROID RLDS cameras: exterior_1, exterior_2, wrist (not eval_images).
  video_image_keys:
    - main_images
    - exterior2_images
    - wrist_images
  save_camera_stills: True
  camera_image_keys:
    - main_images
    - exterior2_images
    - wrist_images
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  # Gym id registered by rlinf.envs.isaaclab.tasks.pick_place_cube_plate
  # (Arena DROID robot/obs/action specs as a single-layout Isaac Lab task).
  id: "Isaac-PickPlace-Cube-Plate-Droid-AbsJointPos-v0"
  action_space: droid_abs_joint_pos
  num_envs: null
  max_episode_steps: ${..max_episode_steps}
  episode_length_s: 20.0
  # Matches Arena pick_and_place_maple_table (rubiks cube → YCB bowl).
  task_description: "Pick up the cube and place it in the bowl."
  # Match openpi DROID RLDS training (droid_rlds_dataset.restructure):
  # sample exterior_1 vs exterior_2 into the policy base slot, once per episode.
  sample_exterior_camera: True
  sample_exterior_camera_prob: 0.5
  # Online Safetics CRI(q, qd) → OpenPI discrete "CRI:" tokens (droid-cri / 49999).
  # CBF-QP filter (IsaacLab CRI-F): cri_pre only, no time-scale s.
  compute_cri: True
  cri_filter: True
  cri_limit: 0.96
  cbf_alpha: 0.02
  cri_filter_enabled: True
  # Optional obs key overrides (defaults match Arena DROID / OpenPI names).
  # main_image_keys: ["external_camera", "exterior_image_1_left"]
  # wrist_image_keys: ["wrist_camera", "wrist_image_left"]
  # joint_keys: ["joint_pos", "arm_joint_pos"]
  # gripper_keys: ["gripper_pos"]
  table_cam:
    height: 224
    width: 224
  wrist_cam:
    height: 224
    width: 224
  # Third-person Arena-docs front view for eval videos (RecordVideo).
  eval_cam:
    height: 480
    width: 640
