env_type: isaaclab
# DROID abs joint-pos action space (8-D). Used by prepare_actions_for_isaaclab.
action_space: droid_abs_joint_pos
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 1050
max_episode_steps: 1050

video_cfg:
  save_video: False
  info_on_video: True
  fps: 15
  video_image_keys:
    - main_images
    - exterior2_images
    - wrist_images
  save_camera_stills: True
  camera_image_keys:
    - main_images
    - exterior2_images
    - wrist_images
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  # Gym id registered by rlinf.envs.isaaclab.tasks.open_fridge_kitchen
  # (Arena kitchen_bench_lightwheel_open_fridge as a single-layout Isaac Lab task).
  id: "Isaac-OpenFridge-Kitchen-Droid-AbsJointPos-v0"
  action_space: droid_abs_joint_pos
  num_envs: null
  max_episode_steps: ${..max_episode_steps}
  # Arena fridge-open: 1050 env steps at OpenPI DROID 15 Hz (70 s).
  episode_length_s: 70.0
  task_description: "open the fridge door"
  sample_exterior_camera: False
  sample_exterior_camera_prob: 0.0
  stand_height_m: 0.8
  # Arena NextTo after ObjectPlacer bakes yaw 1.57 into the DROID AABB.
  # env_cfg default is arena_open_fridge_robot_pos() ≈ (4.60, -1.47, 0.80).
  robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
  # Isaac Lab init_state.rot is wxyz. +90 deg yaw aims converted DROID cams
  # at the fridge door (+Y). Identity looks along +X, away from the door.
  robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
  sim_dt: 0.0083333333
  decimation: 8
  # IsaacLab CRI-F data: one run_cri_filter(q, qd) per env.step from
  # measured joint_pos / joint_vel (not commanded qd_nom).
  # OpenPI CRI tokens are previous-tick cri_pre (reset/first obs = 0).
  compute_cri: True
  cri_filter: True
  cri_limit: 0.96
  cbf_alpha: 0.02
  # False: Isaac resets done envs inside step; RLinf cycle can succeed again.
  # True: hold leftover steps until the next RLinf bootstrap reset.
  hold_after_done: False
  # False: log CRI only; do not rewrite the plant command with qd_cmd.
  cri_filter_enabled: False
  cri_penalty_weight: -0.02
  cri_penalty_limit: 0.96
  cri_penalty_sigma: 20.0
  cri_ovf_threshold: 2.0
  # Soft: cri_penalty_weight * cri_ovf_exp every step (dense).
  # Hard: terminate + one-shot penalty when cri_max >= threshold (Isaac OVF).
  cri_ovf_termination_enabled: False
  cri_ovf_term_threshold: null  # default: cri_penalty_limit (0.96)
  cri_ovf_term_penalty: null  # default: -success_step_reward/3 (~-0.022)
  # Living cost until the first RLinf-cycle success. 0 = off.
  # Train default -dt/100 ≈ -0.000667. 30 steps saved ≈ success/3.
  time_penalty_weight: 0.0
  cri_step_dt: 0.0666666667  # 1/15, OpenPI DROID control dt
  table_cam:
    height: 720
    width: 1280
  wrist_cam:
    height: 720
    width: 1280
  eval_cam:
    height: 480
    width: 640
