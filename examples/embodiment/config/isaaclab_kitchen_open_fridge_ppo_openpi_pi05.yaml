defaults:
  - env/isaaclab_kitchen_open_fridge@env.train
  - env/isaaclab_kitchen_open_fridge@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Official polaris + TacVLA CRI prefix adapter (train script prefers 30000).
# Override at launch with POLARIS_OPENPI_CKPT=/path/to/pytorch/dir
polaris_openpi_ckpt: ${oc.env:POLARIS_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_jointpos_polaris_cri_adapter_rlinf_30000}

cluster:
  num_nodes: 1
  # Collocated on every visible GPU. train_fridge_open_polaris.sh rescales
  # env counts to 64 train / 4 eval per GPU. This host: 2× RTX PRO 6000.
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_kitchen_open_fridge_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  # Eval every 20 steps. The save interval has to be a multiple of this.
  val_check_interval: 20
  eval_at_start: False
  save_interval: 20
  weight_sync_interval: 1

  # Continue the 900-step run after global_step_60. The next update is 61.
  resume_dir: null
  ckpt_path: null

algorithm:
  # grouped_return centers inside the open group and inside the miss
  # group. A batch-wide mean would put a negative on every miss.
  normalize_advantages: False
  # Anchor is actor.model.model_path, snapshotted before resume.
  kl_penalty: low_var_kl
  # Pairing two rollouts and putting a negative on the miss cut reach
  # 60% → 49% by step 187. One rollout per reset.
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  # Clip each of the 15×8 flow dims. chunk_level sums them into one ratio,
  # so a 0.01 nat/dim shift already leaves the ±0.2 clip (ratio ~0.4).
  logprob_type: token_level
  entropy_type: token_level

  # One pass. Ratios inside ±2 nats still carry the time ranking when
  # they sit outside the ±0.2 PPO clip. Beyond ±2 the log-probability has
  # collapsed and the advantage does not move the weights.
  update_epoch: 4
  advantage_trust_ratio: true
  trust_log_ratio_min: -2.0
  trust_log_ratio_max: 2.0
  # Each attempt is centered on its own outcome. Opens rank time and
  # distance against other opens. Misses rank distance against other
  # misses. A chunk above success_chunk_reward_min is the +1 open.
  # No value target, so the loss is the actor term. The value head stays
  # on the checkpoint and is not trained.
  adv_type: grouped_return
  loss_type: actor
  success_chunk_reward_min: 0.5
  loss_agg_func: "token-mean"
  # Holds the update near the π₀.₅ weights that already open the door.
  kl_beta: 0.05
  # entropy_coef 0.005. flow_sde reports entropy 0, so this term is 0.
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  # Isaac clips the value by 0.2 around a critic that already matches the
  # return. From a zero head the return-to-go is about -126, so 0.2 would
  # keep the value at 0. 150 lets the first updates reach that scale.
  value_clip: 150.0
  huber_delta: 10.0

  gamma: 0.995
  gae_lambda: 0.97

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    # 600 steps is 40s at 15 Hz. One epoch, 64 envs/GPU:
    # 64*1*(600/15) = 2560 chunks/rank.
    rollout_epoch: 1
    # 64 envs/GPU. 2 visible GPUs → 128. 8 GPUs → 512.
    # 96/GPU + micro 16 OOM'd by 53MB at a 900-step horizon: actor 59GB,
    # Isaac 18.5GB. Isaac memory follows env count, not the horizon.
    total_num_envs: 128
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      # Each open ends that attempt for GAE. Isaac shuts the door and
      # returns the arm, and the rest of the 900 steps can open it again.
      hold_after_done: False
      isaac_success_termination: True
      repeat_open_after_success: true
      # +1 every time a fresh attempt crosses openness 0.2, the RLinf
      # sparse success scale. A full minute of the other terms stays smaller:
      # door hold +0.15, first movement +0.2, timeout −0.225, 1 m −0.4.
      success_bonus: 1.0
      openness_threshold: 0.2
      # Delta angle reward is off. Paying only the increase made the step
      # reward fall back to the time penalty whenever the door stopped.
      door_progress_weight: 0.0
      door_progress_cap: 2.0
      # weight * openness each live step of the current attempt. After the
      # reset the closed door pays about 0 until it moves again. This weight
      # makes a 0.2 hold over 600 steps pay +0.10, 10% of one success.
      door_openness_weight: 0.0008333333333333333
      # +0.2 the first time each attempt moves the door off rest by 0.05.
      # 0.2 × the +1 success bonus. A later attempt can earn it again.
      reach_bonus: 0.2
      handle_approach_weight: 0.0
      handle_approach_cap: 0.1
      handle_approach_openness: 0.05
      # Per meter from the gripper to the handle bar. The attempt resets
      # past 40 cm, so a full 40 s on that boundary is
      # 0.40 * 600 * 0.0025 = −0.6, under the +1 success bonus. On the
      # bar the term is 0. After an open the arm is back at the spawn
      # and this cost runs again.
      ee_bar_distance_weight: -0.0025
      # Gripper-to-handle distance, the same gap as handle_cm. Past 40 cm
      # the attempt ends with no success bonus and Isaac resets the arm
      # and the door. The rest of the 900 steps can open again.
      hand_fridge_reset_distance_m: 0.40
      episode_length_s: 40.0
      stand_height_m: 0.8
      robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
      robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
      cri_filter: True
      cri_filter_enabled: False
      # hard: rewind to the last scene-reset pose and add no penalty.
      # The door stays shut and the attempt continues. soft would slow the
      # arm and pay cri_penalty_weight instead of rewinding.
      cri_exceed_mode: hard
      cri_penalty_weight: -0.00005
      cri_penalty_limit: 0.96
      # Gripper within 8 cm of the hinged handle bar pays no CRI penalty.
      # This is 0.08 m, the same gap as dist_cm 8 on the eval video.
      # A hard rewind inside that gap still waits until CRI 3. Elsewhere
      # the barrier is 0.96. hard mode rewinds there instead of penalizing.
      # The attempt continues, and the horizon reset still closes the door.
      cri_handle_relax_distance_m: 0.08
      cri_handle_relax_limit: 3.0
      # hard turns the rewind on and drops the penalty.
      cri_boundary_rewind: true
      cri_ovf_termination_enabled: False
      # −0.00025 per live step until that attempt opens the door, then again
      # after the reset. A 600-step timeout pays −0.15. An 11 s open pays
      # about −0.041. Each later open pays the same speed cost from scratch.
      time_penalty_weight: -0.00025
      time_penalty_until_horizon: false
      # OpenPI resizes to 224. 32 tiled views/GPU keeps Isaac off the actor update.
      table_cam:
        height: 224
        width: 224
      wrist_cam:
        height: 224
        width: 224
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: 2
      extra_info_on_video:
        - episode.Episode_Reward/cri_ovf
        - episode.success_once
        - episode.success_count
        - episode.reach_once
        - episode.door_openness
        - episode.door_progress
        - episode.Episode_Reward/door_openness
        - episode.cri_ovf_term_count
        - episode.cri_rewind_count
        - episode.cri_rewind_once
        - episode.success_without_cri
        - episode.Episode_Reward/time_penalty
        - episode.Episode_Reward/ee_bar_distance
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    # 4 epochs × 4 envs/GPU. 2 GPUs → 32 episodes. 8 GPUs → 128.
    rollout_epoch: 4
    # Second Isaac Kit stays resident during actor train. Keep this small
    # (4/GPU). 2 GPUs → 8. 8 GPUs → 32.
    total_num_envs: 8
    # 60s at 15 Hz, same horizon as train. Typical PolarIS opens ~12s.
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 900
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    init_params:
      # Same attempt rules and rewards as train. Env count stays small
      # because this Isaac Kit stays up during the actor update.
      hold_after_done: False
      isaac_success_termination: True
      repeat_open_after_success: true
      success_bonus: 1.0
      openness_threshold: 0.2
      door_progress_weight: 0.0
      door_progress_cap: 2.0
      door_openness_weight: 0.0008333333333333333
      reach_bonus: 0.2
      handle_approach_weight: 0.0
      handle_approach_cap: 0.1
      handle_approach_openness: 0.05
      ee_bar_distance_weight: -0.0025
      hand_fridge_reset_distance_m: 0.40
      episode_length_s: 60.0
      stand_height_m: 0.8
      robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
      robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
      cri_filter: True
      cri_filter_enabled: False
      cri_exceed_mode: hard
      cri_penalty_weight: -0.00005
      cri_penalty_limit: 0.96
      cri_handle_relax_distance_m: 0.08
      cri_handle_relax_limit: 3.0
      cri_boundary_rewind: true
      cri_ovf_termination_enabled: False
      time_penalty_weight: -0.00025
      time_penalty_until_horizon: false
      table_cam:
        height: 224
        width: 224
      wrist_cam:
        height: 224
        width: 224
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: null
      extra_info_on_video:
        - episode.Episode_Reward/cri_ovf
        - episode.success_once
        - episode.success_count
        - episode.reach_once
        - episode.cri_ovf_term_count
        - episode.cri_rewind_count
        - episode.cri_rewind_once
        - episode.success_without_cri
        - episode.Episode_Reward/time_penalty
      right_info_on_video:
        - episode.cri_max
        - episode.cri_limit
        - episode.handle_cm
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${polaris_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 3840 % 16 == 0. Same gradient as a smaller micro-batch.
  # 96/GPU died on a 490MB multiply with 437MB free. The actor took 3.2GB
  # of the 3.4GB Isaac drop. 64/GPU frees another measured 3.5GB of Isaac.
  micro_batch_size: 16
  # Per-rank chunks: (envs/GPU)*rollout_epoch*(600/15) = 64*1*40 = 2560.
  # 2 GPUs → 5120. 8 GPUs → 20480. The train script recomputes this
  # from the horizon when actor.global_batch_size is not overridden.
  global_batch_size: 5120
  seed: 42
  enable_offload: False

  model:
    model_path: ${polaris_openpi_ckpt}
    model_type: "openpi"
    precision: null
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri_adapter"
      num_images_in_input: 2
      # Noise 0 is the ~100% mean trajectory but has no PPO gradient.
      # 0.02 left the step-1 ratio near 0.4, so the ±0.2 clip dropped the
      # time ranking. 0.1 widens the flow std about 5× and started at 48% success.
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      # CRI prefix makes prefix_mask length != VLM tokens; mean-pool the
      # last dim instead of indexing with the language mask.
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    # 5e-4 on the first Adam step zeroed reach. Start at 5e-5 and adapt
    # from actor/kl_loss (distance to the opening checkpoint). desired_kl
    # 1.0 holds the rate while KL is in [0.5, 2.0]: /1.5 above 2.0, *1.5
    # below 0.5, and never above 1e-4.
    lr: 5.0e-5
    lr_scheduler: adaptive
    desired_kl: 0.05
    adaptive_lr_min: 1.0e-5
    adaptive_lr_max: 1.0e-4
    # Value head only (its input is detached). 5e-4 matches the Isaac
    # critic rate so a cold head can leave 0. The actor rate stays 5e-5.
    value_lr: 5.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    # OpenPI PPO default. Advantages are O(0.1) and grad norm stays near 2,
    # so the previous 0.2 cap discarded most of the time-ranking step.
    clip_grad: 1.0
    weight_decay: 0.01
    # Step 100 already finished critic warmup. A non-zero budget here would
    # freeze the actor again and rebuild Adam, dropping the loaded moments.
    critic_warmup_steps: 0
    critic_warmup_update_epoch: 0

  fsdp_config:
    strategy: "fsdp"
    # shard_grad_op flattens embed_tokens to 1-D; F.embedding needs 2-D.
    # Summon-during-sync also left those views 1-D after the first rollout.
    sharding_strategy: "no_shard"
    # CRI prefix (cri_pos) is a root Parameter; FlatParameter rejects
    # mixed requires_grad / dtypes without orig params.
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
