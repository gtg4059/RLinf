defaults:
  - env/isaaclab_kitchen_open_fridge@env.train
  - env/isaaclab_kitchen_open_fridge@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Official polaris + TacVLA CRI prefix adapter (train script prefers 30000).
# Override at launch with POLARIS_OPENPI_CKPT=/path/to/pytorch/dir
polaris_openpi_ckpt: ${oc.env:POLARIS_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_jointpos_polaris_cri_adapter_rlinf_30000}

cluster:
  num_nodes: 1
  # Collocated on every visible GPU. train_fridge_open_polaris.sh rescales
  # env counts to 32 train / 4 eval per GPU. This host: 2× RTX PRO 6000.
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_kitchen_open_fridge_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  eval_at_start: True
  save_interval: 50
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.02
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    # 300 steps is 20s at 15 Hz. Two epochs keep per-rank chunks at
    # 32*2*(300/15) = 1280, so the actor update stays the size that fit
    # on 2× 96GB with 32 kitchens resident.
    rollout_epoch: 2
    # 32 envs/GPU. 2 visible GPUs → 64. 8 GPUs → 256.
    total_num_envs: 64
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      hold_after_done: False
      episode_length_s: 20.0
      stand_height_m: 0.8
      robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
      robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0 #-0.01
      cri_penalty_limit: 0.96
      # Hard CRI OVF term: set true to terminate + -success/3 on cri_max >= 0.96.
      cri_ovf_termination_enabled: False
      # Living cost until the first cycle success (leftover Isaac
      # episodes do not keep paying). -dt/100: 30 steps saved ≈ success/3,
      # so a 300-step miss costs about three successes.
      time_penalty_weight: -0.000667
      # OpenPI resizes to 224. 32 tiled views/GPU keeps Isaac off the actor update.
      table_cam:
        height: 224
        width: 224
      wrist_cam:
        height: 224
        width: 224
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: 2
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.reach_once
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    # Second Isaac Kit stays resident during actor train. Keep this small
    # (4/GPU). 2 GPUs → 8. 8 GPUs → 32.
    total_num_envs: 8
    # 20s at 15 Hz, same horizon as train. Typical PolarIS opens ~26s,
    # so successes between 20s and 26s count as failures here.
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    init_params:
      hold_after_done: False
      episode_length_s: 20.0
      stand_height_m: 0.8
      robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
      robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0.0
      cri_penalty_limit: 0.96
      time_penalty_weight: 0.0
      table_cam:
        height: 224
        width: 224
      wrist_cam:
        height: 224
        width: 224
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: null
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.reach_once
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${polaris_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 1280 % micro must be 0. Kitchen USD + no_shard actor OOM'd at 16.
  micro_batch_size: 8
  # Per-rank chunks: (envs/GPU)*rollout_epoch*(300/15) = 32*2*20 = 1280.
  # 2 GPUs → 2560. 8 GPUs → 10240.
  global_batch_size: 2560
  seed: 42
  enable_offload: False

  model:
    model_path: ${polaris_openpi_ckpt}
    model_type: "openpi"
    precision: null
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri_adapter"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      # CRI prefix makes prefix_mask length != VLM tokens; mean-pool the
      # last dim instead of indexing with the language mask.
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    # shard_grad_op flattens embed_tokens to 1-D; F.embedding needs 2-D.
    # Summon-during-sync also left those views 1-D after the first rollout.
    sharding_strategy: "no_shard"
    # CRI prefix (cri_pos) is a root Parameter; FlatParameter rejects
    # mixed requires_grad / dtypes without orig params.
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
