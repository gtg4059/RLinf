defaults:
  - env/isaaclab_kitchen_open_fridge@env.train
  - env/isaaclab_kitchen_open_fridge@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# PolaRiS joint-pos + CRI LoRA 10k, merged for RLinf (model.safetensors).
# Override at launch with POLARIS_OPENPI_CKPT=/path/to/pytorch/dir
polaris_openpi_ckpt: ${oc.env:POLARIS_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_jointpos_polaris_cri_rlinf_10000}

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_kitchen_open_fridge_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  eval_at_start: True
  save_interval: 50
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.02
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    # Kitchen USD is heavier than maple table. 8 GPUs → 8 envs/GPU.
    total_num_envs: 64
    max_episode_steps: 150
    max_steps_per_rollout_epoch: 150
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      hold_after_done: False
      episode_length_s: 10.0
      stand_height_m: 0.8
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: -0.01
      cri_penalty_limit: 0.96
      # Hard CRI OVF term: set true to terminate + -success/3 on cri_max >= 0.96.
      cri_ovf_termination_enabled: False
      # Living cost until the first cycle success (leftover Isaac
      # episodes do not keep paying). 30 steps saved ≈ success/3.
      time_penalty_weight: -0.0001
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: 2
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    total_num_envs: 32
    max_episode_steps: 150
    max_steps_per_rollout_epoch: 150
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    init_params:
      hold_after_done: False
      episode_length_s: 10.0
      stand_height_m: 0.8
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0.0
      cri_penalty_limit: 0.96
      time_penalty_weight: 0.0
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: null
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${polaris_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  # 8 GPUs: (64/8)*2*(150/15) = 160 / rank → global 1280
  global_batch_size: 1280
  seed: 42
  enable_offload: False

  model:
    model_path: ${polaris_openpi_ckpt}
    model_type: "openpi"
    precision: null
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
