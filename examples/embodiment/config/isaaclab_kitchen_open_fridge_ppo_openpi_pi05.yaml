defaults:
  - env/isaaclab_kitchen_open_fridge@env.train
  - env/isaaclab_kitchen_open_fridge@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Official polaris + TacVLA CRI prefix adapter (train script prefers 30000).
# Override at launch with POLARIS_OPENPI_CKPT=/path/to/pytorch/dir
polaris_openpi_ckpt: ${oc.env:POLARIS_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_jointpos_polaris_cri_adapter_rlinf_30000}

cluster:
  num_nodes: 1
  # Collocated on every visible GPU. train_fridge_open_polaris.sh rescales
  # env counts to 64 train / 4 eval per GPU. This host: 2× RTX PRO 6000.
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_kitchen_open_fridge_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  # Eval every 20 steps. The save interval has to be a multiple of this.
  val_check_interval: 20
  eval_at_start: False
  save_interval: 20
  weight_sync_interval: 1

  # Fresh run from polaris_openpi_ckpt. The KL reference is that
  # checkpoint, snapshotted before any resume load.
  resume_dir: null
  ckpt_path: null

algorithm:
  # polaris_tapeintocontainer_ppo_openpi_pi05. While the door stays
  # past the openness threshold, every step pays success_bonus.
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # One pass. A second pass on the same 128×450 batch was 175s of a
  # 622s step and added no new samples. Collection stays the long part.
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.02
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  advantage_trust_ratio: False
  # Standard flow-SDE PPO. π_old is the rollout logprob, so the clip is the
  # ratio band [0.8, 1.2]. The actor rate below tracks actor/update_kl.
  replay_old_logprob: False
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.995
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    # 450 steps is 30s at 15 Hz. One pass per update, 80 envs/GPU:
    # 80*1*(450/15) = 2400 chunks/rank.
    rollout_epoch: 1
    # 80 envs/GPU. 2 visible GPUs → 160. 8 GPUs → 640.
    # 96/GPU + micro 16 OOM'd by 53MB at a 900-step horizon: actor 59GB,
    # Isaac 18.5GB. Isaac follows env count. 64/GPU left about 3.5GB of
    # that Isaac allocation free. 80/GPU puts it back on the rollout.
    # The train script overrides this from the visible GPU count.
    total_num_envs: 160
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      # The arm keeps acting after the open. A hold would freeze the
      # action and drop the later +1s from the update.
      hold_after_done: False
      # Isaac's success term shuts the door inside the step. Leave it
      # open so the threshold stays true and the payment continues.
      isaac_success_termination: false
      repeat_open_after_success: false
      # +1.0 on every live step with openness above the threshold.
      success_bonus: 1.0
      success_reward_while_open: true
      success_time_cost: 0.0
      openness_threshold: 0.2
      door_progress_weight: 0.0
      door_progress_cap: 2.0
      door_openness_weight: 0.0
      reach_bonus: 0.0
      handle_reach_bonus: 0.0
      handle_approach_weight: 0.0
      handle_approach_cap: 0.1
      handle_approach_openness: 0.05
      ee_bar_distance_weight: 0.0
      # null leaves the attempt running when the gripper leaves the handle.
      hand_fridge_reset_distance_m: null
      episode_length_s: 30.0
      stand_height_m: 0.8
      robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
      robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
      cri_filter: True
      cri_filter_enabled: False
      # Crossing the CRI limit rewinds the arm to the spawn pose.
      # The episode clock keeps running and that step pays 0. A door
      # already past 0.2 is left open, so the per-step +1 continues.
      cri_exceed_mode: hard
      cri_soft_arm_limit: false
      cri_penalty_weight: 0.0
      cri_chunk_penalty: 0.0
      cri_rewind_penalty: 0.0
      cri_penalty_limit: 0.96
      cri_handle_relax_distance_m: 0.12
      cri_handle_relax_limit: 3.0
      cri_boundary_rewind: true
      cri_ovf_termination_enabled: false
      cri_ovf_term_penalty: 0.0
      time_penalty_weight: 0.0
      time_penalty_until_horizon: false
      action_rate_weight: 0.0
      closed_hinge_weight: 0.0
      failure_penalty: 0.0
      # OpenPI resizes to 224. 32 tiled views/GPU keeps Isaac off the actor update.
      table_cam:
        height: 224
        width: 224
      wrist_cam:
        height: 224
        width: 224
    video_cfg:
      # Train rollouts do not write mp4. Eval still records every
      # runner.val_check_interval (20) steps.
      save_video: False
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: 2
      extra_info_on_video:
        - episode.Episode_Reward/cri_ovf
        - episode.success_once
        - episode.success_count
        - episode.reach_once
        - episode.Episode_Reward/handle_reach
        - episode.Episode_Reward/door_open
        - episode.door_openness
        - episode.door_progress
        - episode.Episode_Reward/door_openness
        - episode.cri_ovf_term_count
        - episode.cri_rewind_count
        - episode.cri_rewind_once
        - episode.success_without_cri
        - episode.Episode_Reward/time_penalty
        - episode.Episode_Reward/action_rate
        - episode.Episode_Reward/ee_bar_distance
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    # 2 epochs × 4 envs/GPU. 2 GPUs → 16 episodes. 8 GPUs → 64.
    rollout_epoch: 2
    # Second Isaac Kit stays resident during actor train. Keep this small
    # (4/GPU). 2 GPUs → 8. 8 GPUs → 32.
    total_num_envs: 8
    # 30s at 15 Hz, same horizon as train.
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    init_params:
      # Same attempt rules and rewards as train. Env count stays small
      # because this Isaac Kit stays up during the actor update.
      hold_after_done: False
      isaac_success_termination: false
      repeat_open_after_success: false
      success_bonus: 1.0
      success_reward_while_open: true
      success_time_cost: 0.0
      openness_threshold: 0.2
      door_progress_weight: 0.0
      door_progress_cap: 2.0
      door_openness_weight: 0.0
      reach_bonus: 0.0
      handle_reach_bonus: 0.0
      handle_approach_weight: 0.0
      handle_approach_cap: 0.1
      handle_approach_openness: 0.05
      ee_bar_distance_weight: 0.0
      hand_fridge_reset_distance_m: null
      episode_length_s: 30.0
      stand_height_m: 0.8
      robot_pos: [4.603651840801024, -1.4710035928444452, 0.8]
      robot_rot: [0.70710678, 0.0, 0.0, 0.70710678]
      cri_filter: True
      cri_filter_enabled: False
      # Crossing the CRI limit rewinds the arm to the spawn pose.
      # The episode clock keeps running and that step pays 0. A door
      # already past 0.2 is left open, so the per-step +1 continues.
      cri_exceed_mode: hard
      cri_soft_arm_limit: false
      cri_penalty_weight: 0.0
      cri_chunk_penalty: 0.0
      cri_rewind_penalty: 0.0
      cri_penalty_limit: 0.96
      cri_handle_relax_distance_m: 0.12
      cri_handle_relax_limit: 3.0
      cri_boundary_rewind: true
      cri_ovf_termination_enabled: false
      cri_ovf_term_penalty: 0.0
      time_penalty_weight: 0.0
      time_penalty_until_horizon: false
      action_rate_weight: 0.0
      closed_hinge_weight: 0.0
      failure_penalty: 0.0
      table_cam:
        height: 224
        width: 224
      wrist_cam:
        height: 224
        width: 224
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: null
      extra_info_on_video:
        - episode.Episode_Reward/cri_ovf
        - episode.success_once
        - episode.success_count
        - episode.reach_once
        - episode.Episode_Reward/handle_reach
        - episode.Episode_Reward/door_open
        - episode.cri_ovf_term_count
        - episode.cri_rewind_count
        - episode.cri_rewind_once
        - episode.success_without_cri
        - episode.Episode_Reward/time_penalty
        - episode.Episode_Reward/action_rate
      right_info_on_video:
        - episode.cri_max
        - episode.cri_limit
        - episode.handle_cm
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${polaris_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 4800 % 16 == 0. Micro 32 doubled the update activation and OOM'd.
  # Rollout is already offloaded here; the forward still needs 16.
  micro_batch_size: 16
  # Per-rank chunks: (envs/GPU)*rollout_epoch*(450/15) = 80*1*30 = 2400.
  # 2 GPUs → 4800. 8 GPUs → 19200. The train script recomputes this
  # from the horizon when actor.global_batch_size is not overridden.
  global_batch_size: 4800
  seed: 42
  enable_offload: False

  model:
    model_path: ${polaris_openpi_ckpt}
    model_type: "openpi"
    precision: null
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri_adapter"
      num_images_in_input: 2
      # Noise 0 is the ~100% mean trajectory but has no PPO gradient.
      # 0.02 left the step-1 ratio near 0.4, so the ±0.2 clip dropped the
      # time ranking. 0.1 widens the flow std about 5× and started at 48% success.
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      # CRI prefix makes prefix_mask length != VLM tokens; mean-pool the
      # last dim instead of indexing with the language mask.
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
    # update_kl above 0.10 shrinks this rate by 1.5; below 0.025 it grows.
    # The floor is under the 1e-6 start so a large flow-SDE KL can shrink it.
    lr_scheduler: adaptive
    desired_kl: 0.016
    adaptive_lr_min: 5.0e-7
    adaptive_lr_max: 5.0e-6

  fsdp_config:
    strategy: "fsdp"
    # shard_grad_op flattens embed_tokens to 1-D; F.embedding needs 2-D.
    # Summon-during-sync also left those views 1-D after the first rollout.
    sharding_strategy: "no_shard"
    # CRI prefix (cri_pos) is a root Parameter; FlatParameter rejects
    # mixed requires_grad / dtypes without orig params.
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
