defaults:
  - env/isaaclab_pick_place_cube_plate@env.train
  - env/isaaclab_pick_place_cube_plate@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# RLinf-loadable OpenPI weights converted from JAX ``49999`` (LoRA merged).
# Prepare with:
#   bash examples/embodiment/scripts/prepare_cri_openpi_ckpt.sh \
#     /workspace/RLinf/49999 \
#     /workspace/RLinf/checkpoints/pi05_droid_cri_rlinf_49999
# Override at launch with CRI_OPENPI_CKPT=/path/to/pytorch/dir
cri_openpi_ckpt: ${oc.env:CRI_OPENPI_CKPT,/workspace/RLinf/checkpoints/pi05_droid_cri_rlinf_49999}

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 100
  weight_sync_interval: 1

  # Start RL from the converted 49999 OpenPI weights (no prior RL actor/optim).
  # Value head is randomly initialized (add_value_head: True).
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # Stabilization vs prior collapse (~step 200): fewer PPO passes + entropy.
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.01
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    # Isaac RTX hits descriptor OOM at 96 envs. Empirically:
    #   32 envs ≈ 38GB OK, 48 envs ≈ 44GB OK, 96 envs fails.
    # Cap envs here; fill remaining VRAM via actor micro_batch.
    total_num_envs: 48
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: True
    seed: 42
    # Policy base camera: 50:50 exterior_1/2 per episode (openpi DROID RLDS).
    # CRI(q, qd) is computed online and tokenized as a discrete VLM span
    # (openpi droid-cri / 49999). Both flags live in the env yaml init_params.
    # No video/stills during training (use eval_* configs to dump cameras).
    video_cfg:
      save_video: False
      save_camera_stills: False
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      save_camera_stills: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  # Offload between phases so actor train can use the free ~50GB.
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${cri_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Use leftover VRAM (≈50GB free at 48-env rollout) for activations.
  micro_batch_size: 64
  # Must divide rollout size: envs(48) * rollout_epoch(2) * (450/15 chunks) = 2880
  global_batch_size: 960
  seed: 42
  enable_offload: False

  model:
    model_path: ${cri_openpi_ckpt}
    model_type: "openpi"
    # OpenPI manages dtype internally; keep null (see model/pi0_5.yaml).
    precision: null
    # DROID: joint(7) + gripper(1)
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_cri"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True
    # Optional: point at the directory that contains norm_stats.json if it is
    # not under ${cri_openpi_ckpt}/assets/droid/.
    # openpi_data:
    #   norm_stats_path: /workspace/RLinf/checkpoints/pi05_droid_cri_rlinf_49999/assets/droid/norm_stats.json

  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    # Optimizer steps (not global steps). With update_epoch=2 ≈ 40 global steps.
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
