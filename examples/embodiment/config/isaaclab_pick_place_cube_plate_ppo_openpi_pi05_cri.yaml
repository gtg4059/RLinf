defaults:
  - env/isaaclab_pick_place_cube_plate@env.train
  - env/isaaclab_pick_place_cube_plate@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# RLinf-loadable OpenPI weights converted from JAX ``49999`` (LoRA merged).
# Default: <repo>/checkpoint/pi05_droid_cri_rlinf_49999 (also accepts checkpoints/).
# Host launch (enters rlinf:embodied-isaaclab-u24, then the blackwell tag):
#   bash examples/embodiment/scripts/train_cri_openpi_ckpt.sh
# run_embodiment.sh also auto-exports CRI_OPENPI_CKPT. Prepare with:
#   bash examples/embodiment/scripts/prepare_cri_openpi_ckpt.sh
# Override at launch with CRI_OPENPI_CKPT=/path/to/pytorch/dir
cri_openpi_ckpt: ${oc.env:CRI_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_cri_rlinf_49999}

cluster:
  num_nodes: 1
  # Collocated on all visible GPUs. This host is 8× RTX PRO 6000 Blackwell (96GB).
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  # Eval + video/traj dump every 50 global steps. Must divide save_interval.
  val_check_interval: 50
  eval_at_start: True
  save_interval: 50
  weight_sync_interval: 1

  # Success-only from OpenPI, PPO knobs from 67e3ac3e. Do not resume later CRI/unlearning snapshots.
  resume_dir: ${oc.env:REPO_PATH,/workspace/RLinf}/logs/20260914-06:57:37-isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri/isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri/checkpoints/global_step_300
  ckpt_path: null

algorithm:
  # Cycle return is success count (1, 2, …). Do not z-score that away.
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.01
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    # Collocated actor+env+rollout on all visible GPUs.
    # Per-GPU envs = total_num_envs / actor_world_size. Must divide evenly.
    # This host currently exposes 8 GPUs → 64 envs/GPU.
    total_num_envs: 128
    # 10 s at OpenPI DROID 15 Hz (1/3 of the 30 s / 450-step horizon).
    max_episode_steps: 150
    max_steps_per_rollout_epoch: 150
    # 67e3ac3e-style cycle: Isaac resets on success; RLinf return keeps
    # adding +1. Last-chunk metrics (ignore False). Leftover is a new
    # Isaac episode, not hold-padding, so actor must not mask after the
    # first done. Do not set auto_reset True (reset storm).
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    # Policy base camera: 50:50 exterior_1/2 per episode (openpi DROID RLDS).
    # Isaac CRI_ex/2026-09-08_17-06-30 used CRI_OVF weight -10 * dt.
    # RLinf adds weight * ovf (no dt); -0.01 is a strong visible term
    # next to dt-scaled success (~+0.067) without copying -10.
    init_params:
      hold_after_done: False
      episode_length_s: 10.0
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: -0.01
      cri_penalty_limit: 0.96
      # Hard CRI OVF term: set true to terminate + -success/3 on cri_max >= 0.96.
      cri_ovf_termination_enabled: False
      # Living cost until the first cycle success (leftover Isaac
      # episodes do not keep paying). 30 steps saved ≈ success/3.
      time_penalty_weight: -0.00005
    # First two train rollouts only (env 0). Later epochs skip encoding.
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: 2
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    # Must be divisible by env world size. 8 GPUs → 32 envs/GPU.
    total_num_envs: 64
    max_episode_steps: 150  # 10 s at OpenPI DROID 15 Hz
    max_steps_per_rollout_epoch: 150
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    init_params:
      hold_after_done: False
      episode_length_s: 10.0
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0.0
      cri_penalty_limit: 0.96
      time_penalty_weight: 0.0
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      # Every val (step_0, step_50, …). 1 would stop after eval_at_start.
      max_videos: null
      save_trajectory: True
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
        - episode.Episode_Reward/cri_ovf
        - episode.cri_ovf_term_count
        - episode.Episode_Reward/time_penalty
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  # Offload between phases so actor train can use the free ~50GB.
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${cri_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Per-rank micro-batch. After rollout offload, ~60GB remains (Isaac+actor).
  # global_batch_size must be divisible by micro_batch_size * actor_world_size.
  micro_batch_size: 128
  # Per-rank chunk-level rollout:
  #   (total_num_envs / actor_ws) * rollout_epoch * (max_steps / num_action_chunks)
  #   8 GPUs: (512/8)*2*(150/15) = 1280
  # batch_per_rank = 10240/8 = 1280 → one PPO minibatch covering the rollout.
  global_batch_size: 10240
  seed: 42
  enable_offload: False

  model:
    model_path: ${cri_openpi_ckpt}
    model_type: "openpi"
    # OpenPI manages dtype internally; keep null (see model/pi0_5.yaml).
    precision: null
    # DROID: joint(7) + gripper(1)
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_cri"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True
    # Optional: point at the directory that contains norm_stats.json if it is
    # not under ${cri_openpi_ckpt}/assets/droid/.
    # openpi_data:
    #   norm_stats_path: ${cri_openpi_ckpt}/assets/droid/norm_stats.json

  optim:
    # 67e3ac3e. Optimizer steps, not global steps.
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
