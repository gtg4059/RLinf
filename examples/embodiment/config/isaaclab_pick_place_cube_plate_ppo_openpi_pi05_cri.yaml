defaults:
  - env/isaaclab_pick_place_cube_plate@env.train
  - env/isaaclab_pick_place_cube_plate@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# RLinf-loadable OpenPI weights converted from JAX ``49999`` (LoRA merged).
# Default: <repo>/checkpoint/pi05_droid_cri_rlinf_49999 (also accepts checkpoints/).
# Host launch (enters rlinf:embodied-isaaclab-u24, then the blackwell tag):
#   bash examples/embodiment/scripts/train_cri_openpi_ckpt.sh
# run_embodiment.sh also auto-exports CRI_OPENPI_CKPT. Prepare with:
#   bash examples/embodiment/scripts/prepare_cri_openpi_ckpt.sh
# Override at launch with CRI_OPENPI_CKPT=/path/to/pytorch/dir
cri_openpi_ckpt: ${oc.env:CRI_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_cri_rlinf_49999}

cluster:
  num_nodes: 1
  # Collocated on all visible GPUs. This host is 8× RTX PRO 6000 Blackwell (96GB).
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  # One eval rollout of the pretrained policy before the first PPO update.
  eval_at_start: True
  # Denser saves so a second collapse can be caught before 100 steps.
  save_interval: 50
  weight_sync_interval: 1

  # Continue PPO from the peak RL snapshot (success ~91.5%), not step 300.
  resume_dir: null # ${oc.env:REPO_PATH,/workspace/RLinf}/logs/20260818-12:49:26-isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri/isaaclab_pick_place_cube_plate_ppo_openpi_pi05_cri/checkpoints/global_step_200
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # Resume from step 200: one PPO pass to avoid the prior collapse replay.
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.01
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    # Collocated actor+env+rollout on all visible GPUs.
    # Per-GPU envs = total_num_envs / actor_world_size. Must divide evenly.
    # This host currently exposes 2 GPUs → 64 envs/GPU.
    total_num_envs: 128
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: True
    seed: 42
    # Policy base camera: 50:50 exterior_1/2 per episode (openpi DROID RLDS).
    # CRI-F: one run_cri_filter(q, qd_nom) per tick; OpenPI sees cri_filter_pre.
    # Plant command is not rewritten (cri_filter_enabled=False). Soft CRI(0.96)
    # penalty is added to sparse task success. Flags also live in env yaml.
    init_params:
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: -0.005
      cri_penalty_limit: 0.96
    # First two train rollouts only (env 0). Later epochs skip encoding.
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 20
      max_envs_in_video: 1
      max_videos: 2
      extra_info_on_video:
        - episode.success_once
        - episode.cri_max
        - episode.cri_ovf
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    # Must be divisible by env world size. 2 GPUs → 32 envs/GPU.
    total_num_envs: 64
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 20
      max_envs_in_video: 1
      max_videos: 1
      extra_info_on_video:
        - episode.success_once
        - episode.cri_max
        - episode.cri_ovf
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  # Offload between phases so actor train can use the free ~50GB.
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${cri_openpi_ckpt}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Per-rank micro-batch. After rollout offload, ~60GB remains (Isaac+actor).
  # global_batch_size must be divisible by micro_batch_size * actor_world_size.
  micro_batch_size: 128
  # Per-rank chunk-level rollout:
  #   (total_num_envs / actor_ws) * rollout_epoch * (max_steps / num_action_chunks)
  #   2 GPUs: (128/2)*2*(450/15) = 3840
  # batch_per_rank = 2560/2 = 1280, and 3840 % 1280 == 0 (3 PPO minibatches).
  global_batch_size: 2560
  seed: 42
  enable_offload: False

  model:
    model_path: ${cri_openpi_ckpt}
    model_type: "openpi"
    # OpenPI manages dtype internally; keep null (see model/pi0_5.yaml).
    precision: null
    # DROID: joint(7) + gripper(1)
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi05_droid_cri"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True
    # Optional: point at the directory that contains norm_stats.json if it is
    # not under ${cri_openpi_ckpt}/assets/droid/.
    # openpi_data:
    #   norm_stats_path: ${cri_openpi_ckpt}/assets/droid/norm_stats.json

  optim:
    # Half the collapse-run actor lr. Applied after resume (DCP would restore 1e-6).
    lr: 5.0e-7
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    # Optimizer steps (not global steps).
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
