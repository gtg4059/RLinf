defaults:
  - env/isaaclab_kitchen_open_fridge@env.train
  - env/isaaclab_kitchen_open_fridge@env.eval
  - model/pi0_5@actor.model
  - model/pi0_5@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Arena-matched local eval of polaris_cri_adapter 30000.
# 0% (32 env / 600 step / noise 0.1) used 224 cams, exterior_2 sampling,
# 40s horizon, and SDE noise. This file pins Arena contracts.
# Launch:
#   bash examples/embodiment/run_embodiment.sh isaaclab_kitchen_open_fridge_openpi_pi05_eval
polaris_openpi_ckpt: ${oc.env:POLARIS_OPENPI_CKPT,${oc.env:REPO_PATH,/workspace/RLinf}/checkpoint/pi05_droid_jointpos_polaris_cri_adapter_rlinf_30000}

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_kitchen_open_fridge_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: 0

  only_eval: False
  val_check_interval: -1
  eval_at_start: True
  save_interval: -1
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 1.0
  gae_lambda: 1.0
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 6
    max_episode_steps: 1050
    max_steps_per_rollout_epoch: 1050
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      hold_after_done: False
      episode_length_s: 70.0
      stand_height_m: 0.8
      task_description: "open the fridge door"
      sample_exterior_camera: False
      sample_exterior_camera_prob: 0.0
      compute_cri: True
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0.0
      cri_penalty_limit: 0.96
      cri_ovf_termination_enabled: False
      time_penalty_weight: 0.0
      sim_dt: 0.0083333333
      decimation: 8
      table_cam:
        height: 720
        width: 1280
      wrist_cam:
        height: 720
        width: 1280
    video_cfg:
      save_video: False

  eval:
    # 6-episode smoke. Goal: 5/6 success_once.
    rollout_epoch: 1
    total_num_envs: 6
    max_episode_steps: 1050
    max_steps_per_rollout_epoch: 1050
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      hold_after_done: False
      episode_length_s: 70.0
      stand_height_m: 0.8
      task_description: "open the fridge door"
      sample_exterior_camera: False
      sample_exterior_camera_prob: 0.0
      compute_cri: True
      cri_filter: True
      cri_filter_enabled: False
      cri_penalty_weight: 0.0
      cri_penalty_limit: 0.96
      time_penalty_weight: 0.0
      sim_dt: 0.0083333333
      decimation: 8
      table_cam:
        height: 720
        width: 1280
      wrist_cam:
        height: 720
        width: 1280
    video_cfg:
      save_video: True
      info_on_video: True
      fps: 15
      max_envs_in_video: 1
      max_videos: 6
      extra_info_on_video:
        - episode.success_once
        - episode.success_count
      video_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      save_camera_stills: True
      camera_image_keys:
        - main_images
        - exterior2_images
        - wrist_images
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${polaris_openpi_ckpt}
    precision: null
    model_type: "openpi"
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    is_lora: False
    lora_rank: 32
    use_proprio: True
    add_value_head: False
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri_adapter"
      num_images_in_input: 2
      noise_level: 0.0
      noise_method: "flow_ode"
      joint_logprob: False
      num_steps: ${rollout.model.num_steps}
      action_env_dim: ${rollout.model.action_dim}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 2 GPU: (6/2)*1*(1050/15)=210/rank → global 420. 420 is not
  # divisible by 16*2=32, so micro_batch_size cannot stay 16.
  micro_batch_size: 15
  global_batch_size: 420
  seed: 42
  enable_offload: False

  model:
    model_path: ${polaris_openpi_ckpt}
    model_type: "openpi"
    precision: null
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: False
    openpi:
      config_name: "pi05_droid_jointpos_polaris_cri_adapter"
      num_images_in_input: 2
      noise_level: 0.0
      noise_method: "flow_ode"
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
